# Modelos de pronóstico, validación temporal y regla de reemplazo. Decisiones en DECISIONES.md (D19 a D24).

cuantiles: [0.1, 0.25, 0.5, 0.75, 0.9, 0.95]

entrenamiento:
  ventana_semanas: 52        # cortes semanales usados para entrenar
  semanas_evaluacion: 4      # cortes más recientes, con el horizonte completo observado, que se reservan para comparar

gbm:                         # HistGradientBoostingRegressor con pérdida cuantílica, uno por cuantil
  max_iter: 200
  learning_rate: 0.1
  max_leaf_nodes: 63
  min_samples_leaf: 100
  random_state: 42

backtest:
  pliegues: 3                # origen móvil: 3 bloques de 4 cortes cada uno (12 semanas evaluadas)

# Un retador reemplaza al modelo vigente solo si cumple las tres condiciones en los mismos cortes.
promocion:
  mejora_minima_costo: 0.02          # costo de negocio al menos 2 % menor
  fraccion_minima_cortes_ganados: 0.5  # menor costo en al menos la mitad de los cortes
  cobertura_minima: 0.70             # al menos 70 % de las ventas reales dentro de P10–P90
